name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build binaries
        run: |
          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -o denver-linux-amd64

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -o denver-linux-arm64

          # macOS amd64 (Intel)
          GOOS=darwin GOARCH=amd64 go build -o denver-darwin-amd64

          # macOS arm64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -o denver-darwin-arm64

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -o denver-windows-amd64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            denver-linux-amd64
            denver-linux-arm64
            denver-darwin-amd64
            denver-darwin-arm64
            denver-windows-amd64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
